  #campus .cp-label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; } #campus .cp-hint { text-transform: none; letter-spacing: 0; }
  #campus .cp-floors { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  #campus .cp-rsearch { width: 100%; background: rgba(255,212,0,.06); border: 1.5px solid var(--acc); color: var(--txt); border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 14px; outline: none; }
  #campus .cp-rsearch:focus { box-shadow: 0 0 0 3px rgba(255,212,0,.25); }
  #campus .cp-scope { color: var(--dim); font-size: 11.5px; margin: 0; }
  #campus .cp-rres { display: grid; gap: 6px; overflow: auto; max-height: 46vh; }
  #campus .cp-room { text-align: left; border-radius: 10px; padding: 8px 12px; white-space: normal; } #campus .cp-room b { display: block; } #campus .cp-room small { color: var(--dim); } #campus .cp-room:hover { border-color: var(--acc); }
  #campus .cp-est { color: #e8c45a; font-size: 11px; margin: 0 0 6px; }
  #campus .cp-orient p { color: #e8c45a; font-size: 11px; margin: 6px 0 0; } #campus .cp-or { color: var(--dim); font-size: 11px; }
  #campus .cp-msg { color: #ffb36b; font-size: 12px; margin: 0; }
  #campus .cp-plan { display: none; flex: 1; flex-direction: column; min-height: 0; border-top: 1px solid var(--line); }
  #campus.plan .cp-plan { display: flex; } #campus.plan .cp-az, #campus.plan .cp-gridwrap { display: none; }
  #campus .cp-tabs { display: flex; gap: 6px; padding: 8px 10px; align-items: center; }
  #campus .cp-ext { margin-left: auto; color: var(--acc); text-decoration: none; font-size: 12px; white-space: nowrap; }
  #campus .cp-planclose { border-radius: 8px; padding: 4px 10px; }
  #campus iframe { flex: 1; border: 0; width: 100%; background: #fff; min-height: 240px; }
  #campus .cp-note { color: var(--dim); font-size: 11px; margin: 0; padding: 6px 10px; } #campus .cp-note a { color: var(--acc); }
  @media (max-width: 900px) { #campus { left: 8px; right: 8px; width: auto; top: 78px; max-height: calc(100vh - 90px); } #campus .cp-main { grid-template-columns: 1fr; } #campus .cp-left { border-right: 0; border-bottom: 1px solid var(--line); } #campus .cp-grid { grid-auto-columns: calc((100% - 12px) / 3); } }
  @media (max-width: 1050px) { #brand small { display: none; } }
  /* ---- air race ---- */
  #raceBtn { position: fixed; top: 116px; left: 50%; transform: translateX(-50%); z-index: 5; font-size: 16px; padding: 7px 18px; box-shadow: 0 4px 18px rgba(0,0,0,.4); }
  #racePanel { display: none; top: 116px; left: 50%; transform: translateX(-50%); padding: 7px 16px; white-space: nowrap; font-size: 15px; z-index: 5; }
  #racePanel b { color: var(--acc); font-weight: 400; } #racePanel span { color: var(--dim); margin-left: 10px; } #racePanel .t { margin-left: 12px; font-size: 19px; color: #fff; }
  #racePanel .k { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; }
  #raceMsg { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); pointer-events: none; z-index: 8; text-align: center; display: none; text-shadow: 0 4px 0 #000, 0 0 20px rgba(0,0,0,.7); }
  #raceMsg.show { display: block; }
  #raceMsg.count { font-size: min(22vw, 170px); color: var(--acc); animation: pop .9s ease-out; }
  #raceMsg.go { font-size: min(20vw, 150px); color: #7dff9a; animation: pop .9s ease-out; }
  #raceMsg.cp { font-size: 40px; color: var(--acc); top: 30%; animation: pop .5s ease-out; }
  #raceMsg.finish { background: var(--bg); border: 2px solid var(--acc); border-radius: 16px; padding: 18px 34px; text-shadow: none; animation: pop .5s ease-out; }
  #raceMsg.finish em { display: block; font-style: normal; color: var(--acc); font-size: 54px; letter-spacing: .12em; }
  #raceMsg.finish strong { display: block; font-weight: 400; font-size: 72px; color: #fff; line-height: 1; }
  #raceMsg.finish small { display: block; font-size: 22px; margin-top: 6px; color: var(--dim); }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(1.6); opacity: 0; } 30% { opacity: 1; } to { transform: translate(-50%, -50%) scale(1); } }
  /* ---- plane crash / rewind overlay ---- */
  #crash { position: fixed; inset: 0; pointer-events: none; z-index: 9; display: none; align-items: center; justify-content: center; }
  #crash.show { display: flex; }
  #crash b { display: none; font-weight: 400; letter-spacing: .12em; text-shadow: 0 0 24px rgba(0,0,0,.8), 0 4px 0 #000; }
  #crash.crash { background: radial-gradient(circle, rgba(255,120,0,.0) 30%, rgba(120,20,0,.45) 100%); animation: flash .5s ease-out; }
  #crash.crash .c1 { display: block; font-size: min(18vw, 150px); color: var(--acc); -webkit-text-stroke: 3px #111; animation: shake .09s infinite alternate; }
  #crash.rewind { background: rgba(20,30,60,.18); }
  #crash.rewind .c2 { display: block; font-size: min(12vw, 96px); color: #fff; animation: blinkrw .5s steps(1) infinite; }
  #crash .scan { position: absolute; inset: 0; display: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 2px, transparent 2px 5px); }
  #crash.rewind .scan { display: block; animation: roll 1.7s linear infinite; }
  @keyframes shake { from { transform: translate(-4px, 2px) rotate(-2deg); } to { transform: translate(4px, -2px) rotate(2deg); } }
  @keyframes flash { from { background-color: rgba(255,240,200,.85); } to { background-color: transparent; } }
  @keyframes blinkrw { 50% { opacity: .35; } }
  @keyframes roll { from { background-position: 0 0; } to { background-position: 0 -120px; } }
  /* ---- settings toolbar + popups ---- */
  #tools { right: 12px; bottom: 12px; display: flex; gap: 6px; padding: 6px; align-items: center; }
  .pop { right: 12px; bottom: 64px; padding: 12px 14px; display: none; width: min(560px, calc(100vw - 24px)); z-index: 8; }
  .pop.open { display: block; } #layersMenu.pop { width: 270px; } #popSeason.pop { width: 430px; }
  .pop-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .pop-h b { color: var(--acc); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  .pop-x { padding: 2px 9px; border-radius: 8px; }
  .plabel { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin: 4px 0 6px; }
  .chips.wrap { flex-wrap: wrap; overflow: visible; }
  #uiRestore { display: none; position: fixed; top: 12px; right: 12px; z-index: 30; }
  body.noui #brand, body.noui #top, body.noui #left, body.noui #tools, body.noui .pop, body.noui #credit, body.noui #campus, body.noui #hint { display: none !important; }
  body.noui #uiRestore { display: block; }
  @media (max-width: 760px) { #tools { bottom: 190px; flex-wrap: wrap; left: 12px; } .pop { bottom: 240px; } #search { width: 150px; } #brand small, #credit { display: none; } #hint { display: none; } }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="labels"></div>

<div id="brand" class="panel"><h1>RAUMFINDER<span>3D</span></h1><small id="stats">loading…</small></div>

<div id="top" class="panel">
  <div id="searchWrap"><input id="search" placeholder="Search places, streets, stops…  ( / )" autocomplete="off"><div id="results"></div></div>
  <button id="campusBtn" class="chip on" title="Find your classroom — TU Dresden Campus Navigator">Campus</button>
  <button id="shareBtn" title="Copy a link to this view">Share</button>
</div>
<div id="layersMenu" class="panel pop">
  <div class="pop-h"><b>Layers</b><button class="pop-x" title="Close">✕</button></div>
  <label><input type="checkbox" data-layer="buildings" checked> Buildings</label>
  <label><input type="checkbox" data-layer="roads" checked> Roads &amp; rail</label>
  <label><input type="checkbox" data-layer="trees" checked> Trees</label>
  <label><input type="checkbox" data-layer="labels" checked> Labels</label>
  <label><input type="checkbox" data-layer="shadows" checked> Shadows</label>
  <label><input type="checkbox" data-layer="effects" checked> Glow effects</label>
  <label><input type="checkbox" data-layer="aerial"> Aerial photo ground</label>
  <label><input type="checkbox" data-layer="people" checked> People</label>
  <label><input type="checkbox" data-layer="leaves" checked> Falling leaves</label>
  <label><input type="checkbox" data-layer="tramline" checked> Tram line 11 (DVB yellow)</label>
</div>

<div id="hud" class="panel"></div>
<button id="raceBtn" class="chip on" style="display:none" title="Fly through 10 checkpoints over Dresden as fast as you can (G)">&#127937; Air race (G)</button>
<div id="racePanel" class="panel"></div>
<div id="raceMsg"></div>
<div id="crash"><b class="c1">CRASH!</b><b class="c2">&#9664;&#9664; REWIND</b><i class="scan"></i></div>
<div id="hint"></div>

<div id="left" class="panel">
  <div id="modes"><button data-mode="explore" class="on">Explore</button><button data-mode="fly">Fly</button><button data-mode="boat">Boat</button><button data-mode="bike">Bike</button><button data-mode="car">Car</button><button data-mode="tram">Tram</button></div>
  <div id="info"></div>
</div>

<div id="tools" class="panel">
  <button data-pop="popTime" title="Time of day and date">Time</button>
  <button data-pop="popSeason" title="Season and weather">Season &amp; weather</button>
  <button data-pop="popPlaces" title="Jump to a landmark">Places</button>
  <button data-pop="layersMenu" id="layersBtn" title="Show or hide map layers">Layers</button>
  <span class="sep"></span>
  <button id="uiBtn" title="Hide all panels (U)">Hide UI</button>
</div>
<button id="uiRestore" class="chip on" title="Show the panels again (U)">Show UI</button>
<div id="popPlaces" class="panel pop">
  <div class="pop-h"><b>Places</b><button class="pop-x" title="Close">✕</button></div>
  <div class="chips wrap" id="presets"></div>
</div>
<div id="popTime" class="panel pop">
  <div class="pop-h"><b>Time of day</b><button class="pop-x" title="Close">✕</button></div>
  <div id="timeRow">
    <div id="clock">12:00<small>CET</small></div>
    <input type="date" id="date">
    <button id="nowBtn" class="chip">Now</button>
    <span class="sp"></span>
    <button class="chip" data-t="sunrise">Sunrise</button><button class="chip" data-t="noon">Noon</button><button class="chip" data-t="golden">Golden hour</button><button class="chip" data-t="night">Night</button>
  </div>
  <input type="range" id="time" min="0" max="1439" step="1" value="720">
  <div id="sunInfo"><span id="sr"></span><span id="sunAlt"></span><span id="ss"></span></div>
</div>
<div id="popSeason" class="panel pop">
  <div class="pop-h"><b>Season &amp; weather</b><button class="pop-x" title="Close">✕</button></div>
  <div class="plabel">Season</div>
  <div class="chips wrap"><button class="chip" data-s="spring">Spring</button><button class="chip" data-s="summer">Summer</button><button class="chip on" data-s="autumn">Autumn</button><button class="chip" data-s="winter">Winter</button></div>
  <div class="plabel" style="margin-top:10px">Weather</div>
  <div class="chips wrap" id="weather">
    <button class="chip on" data-w="clear">Clear</button><button class="chip" data-w="haze">Haze</button><button class="chip" data-w="fog">Fog</button><button class="chip" data-w="rain">Rain</button>
  </div>
</div>
<div id="credit">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors · Aerial imagery &amp; building register © <a href="https://www.geodaten.sachsen.de" target="_blank" rel="noopener">GeoSN</a>, dl-de/by-2-0</div>

<div id="load"><h2>RAUMFINDER 3D</h2><div id="bar"><i></i></div><p id="loadMsg">Loading map data…</p></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
